<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AWS Telemetry Dashboard - Bhubaneshwar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STATIONS = [
      { id: "farm", name: "Bhubaneshwar - Farm" },
      { id: "main", name: "Bhubaneshwar - Main" }
    ];

    function MetricCard({ title, value, unit, icon, color, timestamp }) {
      return (
        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col justify-between hover:border-slate-700 transition">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{title}</span>
            <div className={`p-2 rounded-xl ${color} bg-opacity-20 text-white flex items-center justify-center`}>
              <i data-lucide={icon} className="w-4 h-4"></i>
            </div>
          </div>
          <div>
            <div className="flex items-baseline space-x-1.5">
              <span className="text-2xl font-extrabold text-white tracking-tight">{value ?? "--"}</span>
              <span className="text-xs font-medium text-slate-400">{unit}</span>
            </div>
            {timestamp && (
              <p className="text-[10px] text-slate-500 mt-2 flex items-center gap-1 truncate">
                <i data-lucide="clock" className="w-3 h-3 flex-shrink-0"></i> {timestamp}
              </p>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [selectedStation, setSelectedStation] = useState(STATIONS[0]);
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState(null);
      const [selectedDate, setSelectedDate] = useState("");

      const fetchData = async (station) => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(`/api/weather?station=${station.id}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const resData = await response.json();
          if (resData.status) {
            let records = Array.isArray(resData.data) ? [...resData.data] : [];
            records.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            setData({ ...resData, data: records });
            setLastRefreshed(new Date().toLocaleTimeString());
          } else {
            throw new Error(resData.message || "Failed to load device metrics.");
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData(selectedStation);
        const interval = setInterval(() => fetchData(selectedStation), 60000);
        return () => clearInterval(interval);
      }, [selectedStation.id]);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 50);
        return () => clearTimeout(timer);
      }, [data, loading, selectedDate]);

      const availableDates = useMemo(() => {
        if (!data || !data.data) return [];
        const set = new Set();
        data.data.forEach(d => {
          if (d.created_at && d.created_at.length >= 10) {
            set.add(d.created_at.substring(0, 10));
          }
        });
        return Array.from(set).sort().reverse();
      }, [data]);

      const getMetric = (type) => {
        if (!data || !data.data) return null;
        const matches = data.data.filter(d => {
          const nameMatch = (d.data_class && d.data_class.toLowerCase() === type.toLowerCase()) || 
                            (d.name && d.name.toLowerCase() === type.toLowerCase());
          const dateMatch = selectedDate ? d.created_at.startsWith(selectedDate) : true;
          return nameMatch && dateMatch;
        });
        if (!matches.length) return null;
        return matches.reduce((latest, current) => 
          new Date(current.created_at) > new Date(latest.created_at) ? current : latest
        );
      };

      const filteredRows = useMemo(() => {
        if (!data || !data.data) return [];
        return data.data.filter(item => 
          selectedDate ? item.created_at.startsWith(selectedDate) : true
        );
      }, [data, selectedDate]);

      // Download CSV Export
      const handleDownloadCSV = () => {
        if (!filteredRows.length) {
          alert("No records available to export.");
          return;
        }

        const headers = ["Station", "Device Name", "MAC Address", "Parameter", "Class Code", "Value", "Unit", "Observed Timestamp"];
        const rows = filteredRows.map(item => [
          `"${selectedStation.name}"`,
          `"${data?.device?.name || ''}"`,
          `"${data?.device?.mac || ''}"`,
          `"${item.name || item.data_class || ''}"`,
          `"${item.class_num || ''}"`,
          `"${item.value || ''}"`,
          `"${item.unit === '?' ? '°C' : (item.unit || '')}"`,
          `"${item.created_at || ''}"`
        ]);

        const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const cleanDate = selectedDate || "all";
        const fileTimestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        link.setAttribute("href", url);
        link.setAttribute("download", `AWS_${selectedStation.id}_${cleanDate}_${fileTimestamp}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Download JSON Export
      const handleDownloadJSON = () => {
        if (!filteredRows.length) {
          alert("No records available to export.");
          return;
        }

        const exportPayload = {
          station: selectedStation,
          device: data?.device || {},
          filter_applied: selectedDate || "latest",
          total_records: filteredRows.length,
          exported_at: new Date().toISOString(),
          data: filteredRows
        };

        const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const cleanDate = selectedDate || "all";
        const fileTimestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        link.setAttribute("href", url);
        link.setAttribute("download", `AWS_${selectedStation.id}_${cleanDate}_${fileTimestamp}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="h-10 w-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                <i data-lucide="cloud-sun-rain" className="w-6 h-6"></i>
              </div>
              <div>
                <h1 className="text-2xl font-black text-white">AWS Live Monitoring Portal</h1>
                <p className="text-xs text-slate-400">ICAR-Indian Institute of Water Management</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              {/* Date Filter Dropdown */}
              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5">
                <i data-lucide="calendar" className="w-4 h-4 text-emerald-400"></i>
                <select
                  value={selectedDate}
                  onChange={(e) => setSelectedDate(e.target.value)}
                  className="bg-transparent text-xs text-slate-200 outline-none cursor-pointer"
                >
                  <option value="" className="bg-slate-900 text-slate-200">Latest Transmitted</option>
                  {availableDates.map(date => (
                    <option key={date} value={date} className="bg-slate-900 text-slate-200">{date}</option>
                  ))}
                </select>
              </div>

              {/* Station Toggle Buttons */}
              <div className="inline-flex rounded-xl bg-slate-900 border border-slate-800 p-1">
                {STATIONS.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => {
                      if (selectedStation.id !== s.id) {
                        setSelectedStation(s);
                      }
                    }}
                    className={`px-4 py-2 text-xs font-semibold rounded-lg transition ${
                      selectedStation.id === s.id
                        ? "bg-emerald-500 text-white shadow-lg shadow-emerald-500/20"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    {s.name}
                  </button>
                ))}
              </div>

              {/* Export CSV Button */}
              <button
                onClick={handleDownloadCSV}
                disabled={!filteredRows.length}
                title="Export Filtered Records to CSV"
                className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-emerald-400 hover:border-emerald-500/40 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <i data-lucide="download" className="w-4 h-4 text-emerald-400"></i>
                <span>CSV</span>
              </button>

              {/* Export JSON Button */}
              <button
                onClick={handleDownloadJSON}
                disabled={!filteredRows.length}
                title="Export Filtered Records to JSON"
                className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-cyan-400 hover:border-cyan-500/40 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <i data-lucide="file-code" className="w-4 h-4 text-cyan-400"></i>
                <span>JSON</span>
              </button>

              {/* Refresh Button */}
              <button
                onClick={() => fetchData(selectedStation)}
                disabled={loading}
                title="Refresh Live Telemetry"
                className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white transition"
              >
                <i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`}></i>
              </button>
            </div>
          </header>

          {error && (
            <div className="mt-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-center gap-3">
              <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>
              <span>{error}</span>
            </div>
          )}

          <div className="mt-6 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2 bg-slate-900/40 px-4 py-2.5 rounded-xl border border-slate-800/60">
            <div className="flex items-center gap-4">
              <span className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${loading ? 'bg-amber-400 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>
                Device: <strong className="text-slate-200">{data?.device?.name || selectedStation.name}</strong>
              </span>
              <span>MAC: <code className="text-slate-300">{data?.device?.mac || "N/A"}</code></span>
              {selectedDate && (
                <span className="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">
                  Filtering: {selectedDate}
                </span>
              )}
            </div>
            <span>Last Sync: <strong className="text-slate-200">{lastRefreshed || "--"}</strong></span>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 mt-6">
            <MetricCard
              title="Temperature"
              value={getMetric("temperature")?.value}
              unit={getMetric("temperature")?.unit === "?" ? "°C" : (getMetric("temperature")?.unit || "°C")}
              icon="thermometer"
              color="bg-amber-500"
              timestamp={getMetric("temperature")?.created_at}
            />
            <MetricCard
              title="Rainfall"
              value={getMetric("rainfall")?.value}
              unit={getMetric("rainfall")?.unit || "mm"}
              icon="cloud-rain"
              color="bg-blue-500"
              timestamp={getMetric("rainfall")?.created_at}
            />
            <MetricCard
              title="Humidity"
              value={getMetric("humidity")?.value}
              unit={getMetric("humidity")?.unit || "%"}
              icon="droplets"
              color="bg-cyan-500"
              timestamp={getMetric("humidity")?.created_at}
            />
            <MetricCard
              title="Air Pressure"
              value={getMetric("air_pressure")?.value}
              unit={getMetric("air_pressure")?.unit || "Kpa"}
              icon="gauge"
              color="bg-purple-500"
              timestamp={getMetric("air_pressure")?.created_at}
            />
            <MetricCard
              title="Wind Speed"
              value={getMetric("wind_velocity")?.value}
              unit={getMetric("wind_velocity")?.unit || "m/s"}
              icon="wind"
              color="bg-teal-500"
              timestamp={getMetric("wind_velocity")?.created_at}
            />
            <MetricCard
              title="Wind Direction"
              value={getMetric("wind_direction")?.value}
              unit={getMetric("wind_direction") ? "°" : ""}
              icon="compass"
              color="bg-sky-500"
              timestamp={getMetric("wind_direction")?.created_at}
            />
            <MetricCard
              title="Solar Radiation"
              value={getMetric("solar_radiation")?.value}
              unit={getMetric("solar_radiation")?.unit || "w/m²"}
              icon="sun"
              color="bg-yellow-500"
              timestamp={getMetric("solar_radiation")?.created_at}
            />
            <MetricCard
              title="Sunshine Hours"
              value={getMetric("sunshine_hours")?.value}
              unit={getMetric("sunshine_hours")?.unit || "h"}
              icon="sun-medium"
              color="bg-orange-400"
              timestamp={getMetric("sunshine_hours")?.created_at}
            />
            <MetricCard
              title="Soil Moisture"
              value={getMetric("soil_humidity")?.value}
              unit={getMetric("soil_humidity")?.unit || "%"}
              icon="sprout"
              color="bg-emerald-600"
              timestamp={getMetric("soil_humidity")?.created_at}
            />
            <MetricCard
              title="Soil Temp"
              value={getMetric("soil_temperature")?.value}
              unit={getMetric("soil_temperature")?.unit === "?" ? "°C" : (getMetric("soil_temperature")?.unit || "°C")}
              icon="thermometer-snowflake"
              color="bg-lime-600"
              timestamp={getMetric("soil_temperature")?.created_at}
            />
            <MetricCard
              title="CO2 Level"
              value={getMetric("co2")?.value}
              unit={getMetric("co2")?.unit || "PPM"}
              icon="cloud"
              color="bg-indigo-500"
              timestamp={getMetric("co2")?.created_at}
            />
            <MetricCard
              title="Illumination"
              value={getMetric("illumination")?.value}
              unit={getMetric("illumination")?.unit || "LUX"}
              icon="lightbulb"
              color="bg-amber-400"
              timestamp={getMetric("illumination")?.created_at}
            />
            <MetricCard
              title="PM 2.5"
              value={getMetric("pm25")?.value}
              unit={getMetric("pm25")?.unit || "ug/m³"}
              icon="wind"
              color="bg-rose-400"
              timestamp={getMetric("pm25")?.created_at}
            />
            <MetricCard
              title="PM 10"
              value={getMetric("pm10")?.value}
              unit={getMetric("pm10")?.unit || "ug/m³"}
              icon="activity"
              color="bg-rose-500"
              timestamp={getMetric("pm10")?.created_at}
            />
            <MetricCard
              title="Battery"
              value={getMetric("battery_level")?.value}
              unit={getMetric("battery_level")?.unit || "mV"}
              icon="battery-charging"
              color="bg-green-500"
              timestamp={getMetric("battery_level")?.created_at}
            />
            <MetricCard
              title="Solar Panel"
              value={getMetric("solar_panel_voltage")?.value}
              unit={getMetric("solar_panel_voltage")?.unit || "mV"}
              icon="zap"
              color="bg-amber-600"
              timestamp={getMetric("solar_panel_voltage")?.created_at}
            />
          </div>

          <div className="mt-8 bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 gap-2">
              <h2 className="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="layers" className="w-4 h-4 text-emerald-400"></i>
                Live Telemetry Feeds ({filteredRows.length} records)
              </h2>
              {selectedDate && (
                <button
                  onClick={() => setSelectedDate("")}
                  className="text-xs text-emerald-400 hover:text-emerald-300 underline text-left"
                >
                  Clear date filter
                </button>
              )}
            </div>

            <div className="overflow-x-auto max-h-[500px]">
              <table className="w-full text-left text-xs text-slate-300 relative">
                <thead className="bg-slate-800 text-slate-400 uppercase tracking-wider text-[10px] sticky top-0 z-10 shadow-sm">
                  <tr>
                    <th className="py-3 px-4">Parameter</th>
                    <th className="py-3 px-4">Class Code</th>
                    <th className="py-3 px-4">Value</th>
                    <th className="py-3 px-4">Unit</th>
                    <th className="py-3 px-4">Observed Timestamp</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredRows.length > 0 ? (
                    filteredRows.map((item, idx) => (
                      <tr key={idx} className="hover:bg-slate-800/40 transition">
                        <td className="py-2.5 px-4 font-semibold text-slate-100 capitalize">{item.name || item.data_class}</td>
                        <td className="py-2.5 px-4 font-mono text-slate-400">{item.class_num || "--"}</td>
                        <td className="py-2.5 px-4 font-bold text-emerald-400">{item.value}</td>
                        <td className="py-2.5 px-4">{item.unit === "?" ? "°C" : (item.unit || "--")}</td>
                        <td className="py-2.5 px-4 text-slate-400">{item.created_at}</td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="5" className="py-8 text-center text-slate-500">
                        {loading ? "Streaming telemetry records..." : "No readings found for selected filter."}
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
