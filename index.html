<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AWS Telemetry Dashboard - Bhubaneshwar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STATIONS = [
      { id: "farm", name: "Bhubaneshwar - Farm" },
      { id: "main", name: "Bhubaneshwar - Main" }
    ];

    function MetricCard({ title, value, unit, icon, color, timestamp }) {
      return (
        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between hover:border-slate-700 transition">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{title}</span>
            <div className={`p-2.5 rounded-xl ${color} bg-opacity-20 text-white flex items-center justify-center`}>
              <i data-lucide={icon} className="w-5 h-5"></i>
            </div>
          </div>
          <div>
            <div className="flex items-baseline space-x-1.5">
              <span className="text-3xl font-extrabold text-white tracking-tight">{value ?? "--"}</span>
              <span className="text-sm font-medium text-slate-400">{unit}</span>
            </div>
            {timestamp && (
              <p className="text-[11px] text-slate-500 mt-2 flex items-center gap-1">
                <i data-lucide="clock" className="w-3 h-3"></i> {timestamp}
              </p>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [selectedStation, setSelectedStation] = useState(STATIONS[0]);
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState(null);

      const fetchData = async (station) => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(`/api/weather?station=${station.id}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const resData = await response.json();

          if (resData.status) {
            let records = Array.isArray(resData.data) ? [...resData.data] : [];
            records.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            setData({ ...resData, data: records });
            setLastRefreshed(new Date().toLocaleTimeString());
          } else {
            throw new Error(resData.message || "Failed to load device metrics.");
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData(selectedStation);
        const interval = setInterval(() => fetchData(selectedStation), 60000);
        return () => clearInterval(interval);
      }, [selectedStation.id]);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 50);
        return () => clearTimeout(timer);
      }, [data, loading]);

      const getMetric = (type) => {
        if (!data || !data.data) return null;
        const matches = data.data.filter(d => 
          (d.data_class && d.data_class.toLowerCase() === type.toLowerCase()) || 
          (d.name && d.name.toLowerCase() === type.toLowerCase())
        );
        if (!matches.length) return null;
        return matches.reduce((latest, current) => 
          new Date(current.created_at) > new Date(latest.created_at) ? current : latest
        );
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-8 border-b border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="h-10 w-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                <i data-lucide="cloud-sun-rain" className="w-6 h-6"></i>
              </div>
              <div>
                <h1 className="text-2xl font-black text-white">AWS Live Monitoring Portal</h1>
                <p className="text-xs text-slate-400">ICAR-Indian Institute of Water Management</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="inline-flex rounded-xl bg-slate-900 border border-slate-800 p-1">
                {STATIONS.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => {
                      if (selectedStation.id !== s.id) {
                        setSelectedStation(s);
                      }
                    }}
                    className={`px-4 py-2 text-xs font-semibold rounded-lg transition ${
                      selectedStation.id === s.id
                        ? "bg-emerald-500 text-white shadow-lg shadow-emerald-500/20"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    {s.name}
                  </button>
                ))}
              </div>
              <button
                onClick={() => fetchData(selectedStation)}
                disabled={loading}
                className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white transition"
              >
                <i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`}></i>
              </button>
            </div>
          </header>

          {error && (
            <div className="mt-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-center gap-3">
              <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>
              <span>{error}</span>
            </div>
          )}

          <div className="mt-6 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2 bg-slate-900/40 px-4 py-2.5 rounded-xl border border-slate-800/60">
            <div className="flex items-center gap-4">
              <span className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${loading ? 'bg-amber-400 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>
                Device: <strong className="text-slate-200">{data?.device?.name || selectedStation.name}</strong>
              </span>
              <span>MAC: <code className="text-slate-300">{data?.device?.mac || "N/A"}</code></span>
            </div>
            <span>Last Sync: <strong className="text-slate-200">{lastRefreshed || "--"}</strong></span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 mt-6">
            <MetricCard
              title="Temperature"
              value={getMetric("temperature")?.value}
              unit={getMetric("temperature")?.unit === "?" ? "°C" : (getMetric("temperature")?.unit || "°C")}
              icon="thermometer"
              color="bg-amber-500"
              timestamp={getMetric("temperature")?.created_at}
            />
            <MetricCard
              title="Rainfall"
              value={getMetric("rainfall")?.value}
              unit={getMetric("rainfall")?.unit || "mm"}
              icon="cloud-rain"
              color="bg-blue-500"
              timestamp={getMetric("rainfall")?.created_at}
            />
            <MetricCard
              title="Humidity"
              value={getMetric("humidity")?.value}
              unit={getMetric("humidity")?.unit || "%"}
              icon="droplets"
              color="bg-cyan-500"
              timestamp={getMetric("humidity")?.created_at}
            />
            <MetricCard
              title="Air Pressure"
              value={getMetric("air_pressure")?.value}
              unit={getMetric("air_pressure")?.unit || "Kpa"}
              icon="gauge"
              color="bg-purple-500"
              timestamp={getMetric("air_pressure")?.created_at}
            />
            <MetricCard
              title="PM 2.5"
              value={getMetric("pm25")?.value}
              unit={getMetric("pm25")?.unit || "ug/m³"}
              icon="wind"
              color="bg-orange-500"
              timestamp={getMetric("pm25")?.created_at}
            />
            <MetricCard
              title="PM 10"
              value={getMetric("pm10")?.value}
              unit={getMetric("pm10")?.unit || "ug/m³"}
              icon="activity"
              color="bg-rose-500"
              timestamp={getMetric("pm10")?.created_at}
            />
          </div>

          <div className="mt-8 bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
            <h2 className="text-base font-bold text-white mb-4 flex items-center gap-2">
              <i data-lucide="layers" className="w-4 h-4 text-emerald-400"></i>
              Live Telemetry Feeds
            </h2>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-800/60 text-slate-400 uppercase tracking-wider text-[10px]">
                  <tr>
                    <th className="py-3 px-4 rounded-l-lg">Parameter</th>
                    <th className="py-3 px-4">Class Code</th>
                    <th className="py-3 px-4">Value</th>
                    <th className="py-3 px-4">Unit</th>
                    <th className="py-3 px-4 rounded-r-lg">Observed Timestamp</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {data?.data && data.data.length > 0 ? (
                    data.data.slice(0, 30).map((item, idx) => (
                      <tr key={idx} className="hover:bg-slate-800/40 transition">
                        <td className="py-3 px-4 font-semibold text-slate-100 capitalize">{item.name || item.data_class}</td>
                        <td className="py-3 px-4 font-mono text-slate-400">{item.class_num || "--"}</td>
                        <td className="py-3 px-4 font-bold text-emerald-400">{item.value}</td>
                        <td className="py-3 px-4">{item.unit === "?" ? "°C" : (item.unit || "--")}</td>
                        <td className="py-3 px-4 text-slate-400">{item.created_at}</td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="5" className="py-8 text-center text-slate-500">
                        {loading ? "Streaming telemetry records..." : "No readings recorded."}
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
