<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AWS Telemetry Dashboard - Bhubaneshwar</title>
  
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://unpkg.com">

  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#10b981"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="apple-touch-icon" href="/icar.png"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STATIONS = [
      { id: "farm", name: "IIWM FARM Mendhasal" },
      { id: "main", name: "IIWM Campus" }
    ];

    const clientStationCache = {
      farm: null,
      main: null
    };

    const STATION_PARAMS_INFO = {
      farm: {
        name: "IIWM Mendhasal",
        count: 15,
        params: [
          { name: "Temperature", unit: "°C" },
          { name: "Humidity", unit: "%" },
          { name: "Rainfall", unit: "mm" },
          { name: "Air Pressure", unit: "Kpa" },
          { name: "Wind Velocity", unit: "m/s" },
          { name: "Solar Radiation", unit: "w/m²" },
          { name: "Sunshine Hours", unit: "h" },
          { name: "Soil Humidity", unit: "%" },
          { name: "Soil Temperature", unit: "°C" },
          { name: "CO2 Level", unit: "PPM" },
          { name: "Illumination / Lux", unit: "LUX" },
          { name: "Particulate Matter (PM 2.5)", unit: "ug/m³" },
          { name: "Particulate Matter (PM 10)", unit: "ug/m³" },
          { name: "Battery Working Level", unit: "mV" },
          { name: "Solar Panel Voltage", unit: "mV" }
        ]
      },
      main: {
        name: "IIWM Campus",
        count: 16,
        params: [
          { name: "Temperature", unit: "°C" },
          { name: "Humidity", unit: "%" },
          { name: "Rainfall", unit: "mm" },
          { name: "Air Pressure", unit: "Kpa" },
          { name: "Wind Velocity", unit: "m/s" },
          { name: "Wind Direction", unit: "°"},
          { name: "Solar Radiation", unit: "w/m²" },
          { name: "Sunshine Hours", unit: "h" },
          { name: "Soil Humidity", unit: "%" },
          { name: "Soil Temperature", unit: "°C" },
          { name: "CO2 Level", unit: "PPM" },
          { name: "Illumination / Lux", unit: "LUX" },
          { name: "Particulate Matter (PM 2.5)", unit: "ug/m³" },
          { name: "Particulate Matter (PM 10)", unit: "ug/m³" },
          { name: "Battery Working Level", unit: "mV" },
          { name: "Solar Panel Voltage", unit: "mV" }
        ]
      }
    };

    function formatTimestamp(str) {
      if (!str || typeof str !== "string") return "--";
      const parts = str.trim().split(/[\sT]+/);
      if (parts.length >= 2) {
        const dateParts = parts[0].split("-");
        if (dateParts.length === 3) {
          const [year, month, day] = dateParts;
          const time = parts[1].slice(0, 8);
          return `${day}-${month}-${year} ${time}`;
        }
      }
      return str;
    }

    function getAqiBadge(type, rawVal) {
      if (rawVal === undefined || rawVal === null) return null;
      const val = parseFloat(rawVal);
      if (isNaN(val)) return null;

      if (type === "pm25") {
        if (val <= 30) return { label: "Good", bg: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30" };
        if (val <= 60) return { label: "Satisfactory", bg: "bg-lime-500/10 text-lime-600 dark:text-lime-400 border-lime-500/30" };
        if (val <= 90) return { label: "Moderate", bg: "bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30" };
        if (val <= 120) return { label: "Poor", bg: "bg-orange-500/10 text-orange-600 dark:text-orange-400 border-orange-500/30" };
        if (val <= 250) return { label: "Very Poor", bg: "bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30" };
        return { label: "Severe", bg: "bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/30" };
      }

      if (type === "pm10") {
        if (val <= 50) return { label: "Good", bg: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30" };
        if (val <= 100) return { label: "Satisfactory", bg: "bg-lime-500/10 text-lime-600 dark:text-lime-400 border-lime-500/30" };
        if (val <= 250) return { label: "Moderate", bg: "bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30" };
        if (val <= 350) return { label: "Poor", bg: "bg-orange-500/10 text-orange-600 dark:text-orange-400 border-orange-500/30" };
        if (val <= 430) return { label: "Very Poor", bg: "bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30" };
        return { label: "Severe", bg: "bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/30" };
      }

      return null;
    }

    function MetricCard({ title, value, unit, icon, color, timestamp, isStale, badge, isDropped }) {
      const displayUnit = unit === "?" ? "°C" : (unit || "");
      return (
        <div className={`bg-white dark:bg-slate-900/80 border rounded-2xl p-3.5 sm:p-4 shadow-sm dark:shadow-lg flex flex-col justify-between transition ${
          isDropped 
            ? "border-dashed border-rose-300 dark:border-rose-900/40 bg-rose-500/5"
            : "border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700"
        }`}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 truncate pr-1">
              {title}
            </span>
            <div className={`p-1.5 sm:p-2 rounded-xl ${color} bg-opacity-20 text-white flex items-center justify-center flex-shrink-0`}>
              <i data-lucide={icon} className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </div>
          </div>
          <div>
            <div className="flex items-baseline space-x-1.5 flex-wrap">
              <span className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight">
                {isDropped ? "Offline" : (value ?? "--")}
              </span>
              {!isDropped && <span className="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400">{displayUnit}</span>}
            </div>
            <div className="mt-2 flex items-center justify-between flex-wrap gap-1">
              {timestamp ? (
                <p className="text-[9px] sm:text-[10px] text-slate-400 dark:text-slate-500 flex items-center gap-1 truncate font-mono">
                  <i data-lucide="clock" className="w-2.5 h-2.5 sm:w-3 sm:h-3 flex-shrink-0"></i> {formatTimestamp(timestamp)}
                </p>
              ) : <div></div>}
              {badge && (
                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${badge.bg}`}>
                  {badge.label}
                </span>
              )}
              {isStale && !isDropped && (
                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                  Stale
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    const TELEMETRY_COLUMNS = [
      { key: "temperature", label: "Temperature", unit: "°C" },
      { key: "humidity", label: "Humidity", unit: "%" },
      { key: "rainfall", label: "Rainfall", unit: "mm" },
      { key: "air_pressure", label: "Air Pressure", unit: "Kpa" },
      { key: "wind_velocity", label: "Wind Velocity", unit: "m/s" },
      { key: "wind_direction", label: "Wind Direction", unit: "°", campusOnly: true },
      { key: "solar_radiation", label: "Solar Radiation", unit: "w/m²" },
      { key: "sunshine_hours", label: "Sunshine Hours", unit: "h" },
      { key: "soil_humidity", label: "Soil Humidity", unit: "%" },
      { key: "soil_temperature", label: "Soil Temp", unit: "°C" },
      { key: "co2", label: "CO2 Level", unit: "PPM" },
      { key: "illumination", label: "Illumination / Lux", unit: "LUX" },
      { key: "pm25", label: "Particulate Matter (PM 2.5)", unit: "ug/m³" },
      { key: "pm10", label: "Particulate Matter (PM 10)", unit: "ug/m³" },
      { key: "battery_level", label: "Battery Working Level", unit: "mV" },
      { key: "solar_panel_voltage", label: "Solar Panel Voltage", unit: "mV" }
    ];

    function App() {
      const [selectedStation, setSelectedStation] = useState(STATIONS[0]);
      const [selectedDate, setSelectedDate] = useState("");
      const [selectedParam, setSelectedParam] = useState("all");
      
      const [cardData, setCardData] = useState(() => {
        try {
          const cached = localStorage.getItem(`aws_cache_${STATIONS[0].id}`);
          return cached ? JSON.parse(cached) : null;
        } catch (e) {
          return null;
        }
      });

      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState(null);

      const [showDiag, setShowDiag] = useState(false);
      const [showParamModal, setShowParamModal] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [showTelemetry, setShowTelemetry] = useState(false);
      const [fiveDaysLogs, setFiveDaysLogs] = useState([]);
      const [loadingLogs, setLoadingLogs] = useState(false);
      const [downloadingCSV, setDownloadingCSV] = useState(false);

      const [feedbackName, setFeedbackName] = useState("");
      const [feedbackDesignation, setFeedbackDesignation] = useState("");
      const [feedbackStation, setFeedbackStation] = useState("Both / General");
      const [feedbackParam, setFeedbackParam] = useState("");
      const [feedbackDesc, setFeedbackDesc] = useState("");
      const [feedbackImageName, setFeedbackImageName] = useState("");
      const [feedbackImagePreview, setFeedbackImagePreview] = useState(null);

      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') !== 'light');

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      const loadStationSnapshot = async (stationId, isBackground = false) => {
        if (clientStationCache[stationId]) {
          setCardData(clientStationCache[stationId]);
        } else {
          try {
            const localSaved = localStorage.getItem(`aws_cache_${stationId}`);
            if (localSaved) {
              const parsed = JSON.parse(localSaved);
              clientStationCache[stationId] = parsed;
              setCardData(parsed);
            }
          } catch (e) {}
        }

        try {
          const res = await fetch(`/api/weather?station=${stationId}&mode=latest`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const resData = await res.json();
          if (resData && resData.status) {
            clientStationCache[stationId] = resData;
            localStorage.setItem(`aws_cache_${stationId}`, JSON.stringify(resData));
            if (selectedStation.id === stationId) {
              setCardData(resData);
              setLastRefreshed(new Date().toLocaleTimeString());
            }
          }
        } catch (err) {
          if (!isBackground) setError(err.message);
        } finally {
          if (!isBackground) setLoading(false);
        }
      };

      const fetchFiveDayLogs = async (stationId) => {
        setLoadingLogs(true);
        try {
          const res = await fetch(`/api/weather?station=${stationId}&mode=recent`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const resData = await res.json();
          if (resData && resData.status && Array.isArray(resData.data)) {
            setFiveDaysLogs(resData.data);
          }
        } catch (err) {
          console.error("Telemetry error:", err);
        } finally {
          setLoadingLogs(false);
        }
      };

      useEffect(() => {
        loadStationSnapshot(selectedStation.id, false);
        setFiveDaysLogs([]);
        setSelectedDate("");
        setSelectedParam("all");
        if (showTelemetry) {
          fetchFiveDayLogs(selectedStation.id);
        }

        const otherStation = STATIONS.find(s => s.id !== selectedStation.id);
        let timer = null;
        if (otherStation && !clientStationCache[otherStation.id]) {
          timer = setTimeout(() => loadStationSnapshot(otherStation.id, true), 300);
        }
        return () => { if (timer) clearTimeout(timer); };
      }, [selectedStation.id]);

      const handleStationSwitch = (station) => {
        if (selectedStation.id === station.id) return;
        if (clientStationCache[station.id]) {
          setCardData(clientStationCache[station.id]);
        }
        setSelectedStation(station);
      };

      useEffect(() => {
        const t = setTimeout(() => {
          try {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
              window.lucide.createIcons();
            }
          } catch (e) {
            console.warn("Lucide render suppressed", e);
          }
        }, 50);
        return () => clearTimeout(t);
      }, [cardData, loading, showTelemetry, showDiag, showParamModal, showFeedbackModal, darkMode, feedbackImagePreview, selectedParam]);

      const latestMetrics = useMemo(() => {
        if (!cardData || !Array.isArray(cardData.data)) return {};
        const map = {};
        for (let i = 0; i < cardData.data.length; i++) {
          const item = cardData.data[i];
          if (!item) continue;
          const key = String(item.data_class || item.name || "").toLowerCase().trim();
          if (key) map[key] = item;
        }
        return map;
      }, [cardData]);

      const newestTimestamp = useMemo(() => {
        const values = Object.values(latestMetrics);
        if (!values.length) return null;
        const times = values
          .map(v => v.created_at ? new Date(v.created_at).getTime() : 0)
          .filter(t => !isNaN(t) && t > 0);
        return times.length ? Math.max(...times) : null;
      }, [latestMetrics]);

      const checkStale = (timestamp) => {
        if (!timestamp || !newestTimestamp) return false;
        const t = new Date(timestamp).getTime();
        return !isNaN(t) && (newestTimestamp - t) > 6 * 3600 * 1000;
      };

      const diagnostics = useMemo(() => {
        const batteryRaw = latestMetrics["battery_level"]?.value;
        const batteryMv = parseFloat(batteryRaw);
        const isLowBattery = !isNaN(batteryMv) && batteryMv < 11800;
        const isTelemetryOffline = newestTimestamp ? (Date.now() - newestTimestamp) > 12 * 3600 * 1000 : false;
        
        const monitoredList = [
          "temperature", "rainfall", "humidity", "air_pressure", 
          "wind_velocity", "solar_radiation", "sunshine_hours", 
          "soil_humidity", "soil_temperature", "co2", "illumination", 
          "pm25", "pm10", "battery_level", "solar_panel_voltage"
        ];
        
        const dropped = [];
        for (let i = 0; i < monitoredList.length; i++) {
          const k = monitoredList[i];
          const entry = latestMetrics[k];
          if (!entry || entry.value === null || entry.value === undefined || entry.value === "") {
            dropped.push(k);
          }
        }

        return {
          isLowBattery,
          batteryMv,
          isTelemetryOffline,
          droppedSensors: dropped,
          healthy: !isLowBattery && !isTelemetryOffline && dropped.length === 0
        };
      }, [latestMetrics, newestTimestamp]);

      const availableDates = useMemo(() => {
        if (!Array.isArray(fiveDaysLogs) || !fiveDaysLogs.length) return [];
        const set = new Set();
        for (let i = 0; i < fiveDaysLogs.length; i++) {
          const d = fiveDaysLogs[i];
          if (d && typeof d.created_at === 'string' && d.created_at.length >= 10) {
            set.add(d.created_at.substring(0, 10));
          }
        }
        return Array.from(set).sort().reverse();
      }, [fiveDaysLogs]);

      const filteredLogs = useMemo(() => {
        if (!Array.isArray(fiveDaysLogs)) return [];
        if (!selectedDate) return fiveDaysLogs;
        return fiveDaysLogs.filter(i => i && typeof i.created_at === 'string' && i.created_at.startsWith(selectedDate));
      }, [fiveDaysLogs, selectedDate]);

      const pivotedTelemetryRows = useMemo(() => {
        if (!Array.isArray(filteredLogs) || !filteredLogs.length) return [];
        
        const rowMap = new Map();

        for (let i = 0; i < filteredLogs.length; i++) {
          const item = filteredLogs[i];
          if (!item || !item.created_at) continue;

          const timeKey = item.created_at;
          if (!rowMap.has(timeKey)) {
            rowMap.set(timeKey, { timestamp: timeKey });
          }

          const row = rowMap.get(timeKey);
          const metricKey = String(item.data_class || item.name || "").toLowerCase().trim();
          row[metricKey] = item.value;
        }

        return Array.from(rowMap.values()).sort(
          (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
        );
      }, [filteredLogs]);

      // Filters columns by station and the selected parameter
      const activeColumns = useMemo(() => {
        return TELEMETRY_COLUMNS.filter(col => {
          if (col.campusOnly && selectedStation.id !== "main") return false;
          if (selectedParam !== "all" && col.key !== selectedParam) return false;
          return true;
        });
      }, [selectedStation.id, selectedParam]);

      const handleDownloadFullCSV = async () => {
        setDownloadingCSV(true);
        try {
          const res = await fetch(`/api/weather?station=${selectedStation.id}&mode=csv`);
          const resData = await res.json();
          const allRecords = resData.data || [];
          if (!allRecords.length) return alert("No records available to export.");

          const colsToExport = TELEMETRY_COLUMNS.filter(col => {
            if (col.campusOnly && selectedStation.id !== "main") return false;
            return true;
          });

          const rowMap = new Map();
          for (let i = 0; i < allRecords.length; i++) {
            const item = allRecords[i];
            if (!item || !item.created_at) continue;

            const timeKey = item.created_at;
            if (!rowMap.has(timeKey)) {
              rowMap.set(timeKey, { timestamp: timeKey });
            }

            const row = rowMap.get(timeKey);
            const metricKey = String(item.data_class || item.name || "").toLowerCase().trim();
            row[metricKey] = item.value;
          }

          const sortedRows = Array.from(rowMap.values()).sort(
            (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
          );

          const headers = [
            "Station",
            "Observed Date & Time",
            ...colsToExport.map(c => `"${c.label} (${c.unit})"`)
          ];

          const rows = sortedRows.map(row => {
            const rowValues = [
              `"${selectedStation.name}"`,
              `"${formatTimestamp(row.timestamp)}"`,
              ...colsToExport.map(c => {
                const val = row[c.key];
                return val !== undefined && val !== null && val !== "" ? `"${val}"` : '""';
              })
            ];
            return rowValues.join(",");
          });

          const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\n");
          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const fileTimestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
          link.href = url;
          link.download = `AWS_${selectedStation.id}_MATRIX_${fileTimestamp}.csv`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          alert("CSV export failed: " + err.message);
        } finally { 
          setDownloadingCSV(false);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setFeedbackImageName(file.name);
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            setFeedbackImagePreview(uploadEvent.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSendFeedbackEmail = (e) => {
        e.preventDefault();
        if (!feedbackDesc.trim()) {
          alert("Please provide a description of the issue or incorrect observation.");
          return;
        }

        const recipientEmail = "sdrock2020@gmail.com"; 
        const subject = encodeURIComponent(`[AWS Telemetry Issue Report] - ${feedbackStation}`);
        
        let bodyContent = `Automated Weather Station (AWS) - Data Feedback / Issue Report\n`;
        bodyContent += `===========================================================\n\n`;
        bodyContent += `Sender Name: ${feedbackName || "Not Provided"}\n`;
        bodyContent += `Designation/Role: ${feedbackDesignation || "Not Provided"}\n`;
        bodyContent += `Affected Station: ${feedbackStation}\n`;
        bodyContent += `Affected Parameter: ${feedbackParam || "General / Multiple"}\n`;
        bodyContent += `Dashboard Timestamp: ${lastRefreshed || "N/A"}\n\n`;
        bodyContent += `Issue Description:\n-----------------\n${feedbackDesc}\n\n`;
        if (feedbackImageName) {
          bodyContent += `[Attachment Note]: User has prepared photo: "${feedbackImageName}". (Please attach this image file to this email if sending via your email client).\n`;
        }
        bodyContent += `\nSent via ICAR-IIWM AWS Telemetry Dashboard Web Portal`;

        const mailtoLink = `mailto:${recipientEmail}?subject=${subject}&body=${encodeURIComponent(bodyContent)}`;
        window.location.href = mailtoLink;
        setShowFeedbackModal(false);
      };

      return (
        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8">
          {/* Header */}
          <header className="pb-6 border-b border-slate-200 dark:border-slate-800">
            <div className="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm mb-4">
              <div className="flex items-center justify-between gap-4">
                <div className="flex-grow text-left">
                  <h2 className="text-[10px] sm:text-xs md:text-sm font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 leading-tight">
                    ICAR - IIWM Bhubaneswar
                  </h2>
                  <h1 className="text-lg sm:text-2xl md:text-3xl font-black uppercase tracking-tight text-slate-900 dark:text-white mt-1">
                    Automated Weather Station(AWS) Dashboard
                  </h1>
                  <p className="hidden sm:block text-[11px] md:text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mt-0.5">
                    Indian Institute of Water Management
                  </p>
                </div>
                <div className="flex-shrink-0 flex items-center justify-center">
                  <img 
                    src="/icar.png" 
                    alt="ICAR Logo" 
                    className="h-20 w-20 sm:h-24 sm:w-24 md:h-28 md:w-28 object-contain drop-shadow-md"
                  />
                </div>
              </div>
            </div>

            {/* Controls Bar */}
            <div className="flex flex-wrap items-center justify-between gap-2.5 bg-slate-100/80 dark:bg-slate-900/60 p-2 sm:p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">

          {showParamModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-2xl w-full p-5 sm:p-6 shadow-2xl relative text-slate-800 dark:text-slate-100 flex flex-col max-h-[85vh]">
                <div className="flex items-center justify-between pb-3.5 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
                      <i data-lucide="clipboard-list" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white">
                        AWS Monitored Parameters
                      </h3>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400">
                        Configured sensor parameters across both stations
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowParamModal(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 overflow-y-auto pr-1 text-xs">
                  <div className="bg-slate-50 dark:bg-slate-950/60 rounded-xl p-4 border border-slate-200 dark:border-slate-800">
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                      <span className="font-bold text-emerald-600 dark:text-emerald-400 text-xs uppercase tracking-wider">
                        {STATION_PARAMS_INFO.farm.name}
                      </span>
                      <span className="text-[10px] font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">
                        {STATION_PARAMS_INFO.farm.count} Parameters
                      </span>
                    </div>
                    <ul className="space-y-1.5 text-slate-600 dark:text-slate-300">
                      {STATION_PARAMS_INFO.farm.params.map((p, idx) => (
                        <li key={idx} className="flex items-center justify-between py-0.5 border-b border-slate-100 dark:border-slate-800/50">
                          <span>{idx + 1}. {p.name}</span>
                          <span className="text-[10px] font-mono text-slate-400 dark:text-slate-500">{p.unit}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-950/60 rounded-xl p-4 border border-slate-200 dark:border-slate-800">
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                      <span className="font-bold text-sky-600 dark:text-sky-400 text-xs uppercase tracking-wider">
                        {STATION_PARAMS_INFO.main.name}
                      </span>
                      <span className="text-[10px] font-bold bg-sky-500/10 text-sky-600 dark:text-sky-400 px-2 py-0.5 rounded-full border border-sky-500/20">
                        {STATION_PARAMS_INFO.main.count} Parameters
                      </span>
                    </div>
                    <ul className="space-y-1.5 text-slate-600 dark:text-slate-300">
                      {STATION_PARAMS_INFO.main.params.map((p, idx) => (
                        <li key={idx} className="flex items-center justify-between py-0.5 border-b border-slate-100 dark:border-slate-800/50">
                          <span className={p.special ? "text-amber-600 dark:text-amber-400 font-semibold" : ""}>
                            {idx + 1}. {p.name} {p.special && "★"}
                          </span>
                          <span className="text-[10px] font-mono text-slate-400 dark:text-slate-500">{p.unit}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                  <button
                    onClick={() => setShowParamModal(false)}
                    className="px-3.5 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Feedback & Anomaly Reporting Modal */}
          {showFeedbackModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl relative text-slate-800 dark:text-slate-100 flex flex-col max-h-[90vh]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2 rounded-xl bg-rose-500/10 text-rose-600 dark:text-rose-400">
                      <i data-lucide="message-square-warning" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white">
                        Feedback
                      </h3>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowFeedbackModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSendFeedbackEmail} className="mt-4 overflow-y-auto space-y-3.5 pr-1 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                        Your Name (Optional)
                      </label>
                      <input 
                        type="text" 
                        value={feedbackName}
                        onChange={(e) => setFeedbackName(e.target.value)}
                        placeholder="e.g., XYZ"
                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-slate-100 placeholder-slate-400 outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                        Designation / Role (Optional)
                      </label>
                      <input 
                        type="text" 
                        value={feedbackDesignation}
                        onChange={(e) => setFeedbackDesignation(e.target.value)}
                        placeholder="e.g., XYZ"
                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-slate-100 placeholder-slate-400 outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                        Select Station
                      </label>
                      <select
                        value={feedbackStation}
                        onChange={(e) => setFeedbackStation(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-slate-100 outline-none focus:border-emerald-500"
                      >
                        <option value="IIWM Mendhasal">IIWM Mendhasal</option>
                        <option value="IIWM Campus">IIWM Campus</option>
                        <option value="Both Stations / General UI">Both Stations / Dashboard Issue</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                        Affected Metric (Optional)
                      </label>
                      <input 
                        type="text" 
                        value={feedbackParam}
                        onChange={(e) => setFeedbackParam(e.target.value)}
                        placeholder="e.g., Soil Humidity, Battery, PM 2.5"
                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-slate-100 placeholder-slate-400 outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                      Description of Issue / Feedback <span className="text-rose-500">*</span>
                    </label>
                    <textarea 
                      rows="3"
                      required
                      value={feedbackDesc}
                      onChange={(e) => setFeedbackDesc(e.target.value)}
                      placeholder="What the issue?"
                      className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-slate-100 placeholder-slate-400 outline-none focus:border-emerald-500 resize-none"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-slate-600 dark:text-slate-400 font-semibold mb-1">
                      Upload Screenshot / Photo (Optional)
                    </label>
                    <div className="flex items-center gap-2">
                      <label className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-500 cursor-pointer text-slate-600 dark:text-slate-400 transition bg-slate-50 dark:bg-slate-950">
                        <i data-lucide="image" className="w-4 h-4 text-emerald-500"></i>
                        <span>{feedbackImageName ? "Change Photo" : "Choose File"}</span>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={handleImageUpload} 
                          className="hidden" 
                        />
                      </label>
                      {feedbackImageName && (
                        <span className="text-[11px] text-emerald-600 dark:text-emerald-400 truncate max-w-[200px]">
                          {feedbackImageName}
                        </span>
                      )}
                    </div>
                    {feedbackImagePreview && (
                      <div className="mt-2 relative w-20 h-20 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm">
                        <img src={feedbackImagePreview} alt="Feedback preview" className="w-full h-full object-cover" />
                        <button 
                          type="button" 
                          onClick={() => {
                            setFeedbackImageName("");
                            setFeedbackImagePreview(null);
                          }}
                          className="absolute top-1 right-1 bg-black/70 text-white rounded-full p-0.5"
                        >
                          <i data-lucide="x" className="w-3 h-3"></i>
                        </button>
                      </div>
                    )}
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowFeedbackModal(false)}
                      className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold transition shadow-md shadow-emerald-500/25"
                    >
                      <i data-lucide="send" className="w-3.5 h-3.5"></i>
                      <span>Submit & Send Email</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
