<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AWS Telemetry Dashboard - Bhubaneshwar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STATIONS = [
      { id: "farm", name: "Bhubaneshwar - Farm" },
      { id: "main", name: "Bhubaneshwar - Main" }
    ];

    function MetricCard({ title, value, unit, icon, color, timestamp, isStale }) {
      const displayUnit = unit === "?" ? "°C" : (unit || "");

      return (
        <div className="bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 sm:p-4 shadow-sm dark:shadow-lg flex flex-col justify-between hover:border-slate-300 dark:hover:border-slate-700 transition">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 truncate pr-1">{title}</span>
            <div className={`p-1.5 sm:p-2 rounded-xl ${color} bg-opacity-20 text-white flex items-center justify-center flex-shrink-0`}>
              <i data-lucide={icon} className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </div>
          </div>
          <div>
            <div className="flex items-baseline space-x-1.5">
              <span className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight">{value ?? "--"}</span>
              <span className="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400">{displayUnit}</span>
            </div>
            <div className="mt-2 flex items-center justify-between">
              {timestamp ? (
                <p className="text-[9px] sm:text-[10px] text-slate-400 dark:text-slate-500 flex items-center gap-1 truncate">
                  <i data-lucide="clock" className="w-2.5 h-2.5 sm:w-3 sm:h-3 flex-shrink-0"></i> {timestamp}
                </p>
              ) : <div></div>}
              {isStale && (
                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                  Stale
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [selectedStation, setSelectedStation] = useState(STATIONS[0]);
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState(null);
      const [selectedDate, setSelectedDate] = useState("");
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('theme') !== 'light';
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      const fetchData = async (station) => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(`/api/weather?station=${station.id}&_t=${Date.now()}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const resData = await response.json();
          if (resData.status) {
            let records = Array.isArray(resData.data) ? [...resData.data] : [];
            records.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            setData({ ...resData, data: records });
            setLastRefreshed(new Date().toLocaleTimeString());
          } else {
            throw new Error(resData.message || "Failed to load station metrics.");
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData(selectedStation);
        const interval = setInterval(() => fetchData(selectedStation), 60000);
        return () => clearInterval(interval);
      }, [selectedStation.id]);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 50);
        return () => clearTimeout(timer);
      }, [data, loading, selectedDate, darkMode]);

      const availableDates = useMemo(() => {
        if (!data || !data.data) return [];
        const set = new Set();
        data.data.forEach(d => {
          if (d.created_at && d.created_at.length >= 10) {
            set.add(d.created_at.substring(0, 10));
          }
        });
        return Array.from(set).sort().reverse();
      }, [data]);

      const filteredRows = useMemo(() => {
        if (!data || !data.data) return [];
        return data.data.filter(item =>
          selectedDate ? item.created_at && item.created_at.startsWith(selectedDate) : true
        );
      }, [data, selectedDate]);

      const latestMetrics = useMemo(() => {
        if (!data || !data.data) return {};
        const map = {};
        for (let i = 0; i < data.data.length; i++) {
          const item = data.data[i];
          if (selectedDate && (!item.created_at || !item.created_at.startsWith(selectedDate))) continue;
          const key = (item.data_class || item.name || "").toLowerCase();
          if (!map[key] || new Date(item.created_at) > new Date(map[key].created_at)) {
            map[key] = item;
          }
        }
        return map;
      }, [data, selectedDate]);

      const newestTimestamp = useMemo(() => {
        if (!data?.data?.length) return null;
        return new Date(data.data[0].created_at).getTime();
      }, [data]);

      const checkStale = (timestamp) => {
        if (!timestamp || !newestTimestamp) return false;
        const recordTime = new Date(timestamp).getTime();
        return (newestTimestamp - recordTime) > 6 * 3600 * 1000;
      };

      const displayedRows = useMemo(() => filteredRows.slice(0, 100), [filteredRows]);

      const handleDownloadCSV = () => {
        if (!filteredRows.length) return alert("No records available to export.");
        const headers = ["Station", "Device Name", "MAC Address", "Parameter", "Class Code", "Value", "Unit", "Observed Timestamp"];
        const rows = filteredRows.map(item => [
          `"${selectedStation.name}"`,
          `"${data?.device?.name || ''}"`,
          `"${data?.device?.mac || ''}"`,
          `"${item.name || item.data_class || ''}"`,
          `"${item.class_num || ''}"`,
          `"${item.value || ''}"`,
          `"${item.unit === '?' ? '°C' : (item.unit || '')}"`,
          `"${item.created_at || ''}"`
        ]);
        const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const cleanDate = selectedDate || "all";
        const fileTimestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        link.setAttribute("href", url);
        link.setAttribute("download", `AWS_${selectedStation.id}_${cleanDate}_${fileTimestamp}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8">
          {/* Header */}
          <header className="pb-6 border-b border-slate-200 dark:border-slate-800">
            {/* Top Institutional Banner with Right-Corner Logo */}
            <div className="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm mb-4">
              <div className="flex items-center justify-between gap-4">
                {/* Left: Titles */}
                <div className="flex-grow text-left">
                  <h2 className="text-[10px] sm:text-xs md:text-sm font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 leading-tight">
                    ICAR - IIWM Bhubaneswar
                  </h2>
                  <h1 className="text-lg sm:text-2xl md:text-3xl font-black uppercase tracking-tight text-slate-900 dark:text-white mt-1">
                    Automated Weather Station(AWS) Dashboard
                  </h1>
                  <p className="hidden sm:block text-[11px] md:text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mt-0.5">
                    Indian Institute of water Management
                  </p>
                </div>
                {/* Right Corner: Fixed-Dimension Logo */}
                {/* Right Corner: Clean Large Logo */}
                <div className="flex-shrink-0 flex items-center justify-center">
                <img 
                  src="/icar.png"
                  alt="ICAR Logo"
                  className="h-20 w-20 sm:h-24 sm:w-24 md:h-28 md:w-28 object-contain drop-shadow-md"
                />  
              </div>
              </div>
            </div>

            {/* Bottom Controls Bar */}
            <div className="flex flex-wrap items-center justify-between gap-2.5 bg-slate-100/80 dark:bg-slate-900/60 p-2 sm:p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              {/* Station Switcher */}
              <div className="inline-flex rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-1 shadow-sm">
                {STATIONS.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => { if (selectedStation.id !== s.id) setSelectedStation(s); }}
                    className={`px-3 py-1.5 sm:px-5 sm:py-2 text-xs font-bold rounded-lg transition ${
                      selectedStation.id === s.id
                        ? "bg-emerald-500 text-white shadow-md shadow-emerald-500/25"
                        : "text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"
                    }`}
                  >
                    {s.name}
                  </button>
                ))}
              </div>

              {/* Date Filter, CSV Download, Theme Toggle, Refresh */}
              <div className="flex flex-wrap items-center gap-2">
                {/* Date Dropdown */}
                <div className="flex items-center gap-1.5 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-1.5 shadow-sm">
                  <i data-lucide="calendar" className="w-4 h-4 text-emerald-500"></i>
                  <select
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="bg-transparent text-xs font-medium text-slate-700 dark:text-slate-200 outline-none cursor-pointer"
                  >
                    <option value="" className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200">Latest Transmission</option>
                    {availableDates.map(date => (
                      <option key={date} value={date} className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200">{date}</option>
                    ))}
                  </select>
                </div>

                {/* CSV Download */}
                <button
                  onClick={handleDownloadCSV}
                  disabled={!filteredRows.length}
                  title="Export Data to CSV"
                  className="flex items-center gap-1.5 px-3.5 py-1.5 sm:py-2 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-bold text-slate-700 dark:text-slate-200 hover:text-emerald-500 dark:hover:text-emerald-400 hover:border-emerald-500/40 transition shadow-sm disabled:opacity-40"
                >
                  <i data-lucide="download" className="w-3.5 h-3.5 text-emerald-500"></i>
                  <span>CSV</span>
                </button>

                {/* Theme Switcher */}
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  title="Toggle Dark / Light Mode"
                  className="p-2 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-amber-500 transition shadow-sm"
                >
                  <i data-lucide={darkMode ? "sun" : "moon"} className="w-4 h-4"></i>
                </button>

                {/* Refresh */}
                <button
                  onClick={() => fetchData(selectedStation)}
                  disabled={loading}
                  title="Refresh Data"
                  className="p-2 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-emerald-500 transition shadow-sm"
                >
                  <i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`}></i>
                </button>
              </div>
            </div>
          </header>

          {error && (
            <div className="mt-4 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-300 text-xs sm:text-sm flex items-center gap-2.5">
              <i data-lucide="alert-triangle" className="w-4 h-4 flex-shrink-0"></i>
              <span>{error}</span>
            </div>
          )}

          {/* Telemetry Status Bar */}
          <div className="mt-4 flex flex-col sm:flex-row sm:items-center justify-between text-xs text-slate-500 dark:text-slate-400 gap-2 bg-white dark:bg-slate-900/40 px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${loading ? 'bg-amber-400 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>
                Station: <strong className="text-slate-800 dark:text-slate-200">{data?.device?.name || selectedStation.name}</strong>
              </span>
              {selectedDate && (
                <span className="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20 text-[11px] font-medium">
                  Date: {selectedDate}
                </span>
              )}
            </div>
            <div className="flex items-center justify-between sm:justify-end gap-3 text-[11px]">
              <span>MAC: <code className="font-mono text-slate-700 dark:text-slate-300">{data?.device?.mac || "N/A"}</code></span>
              <span>Updated: <strong className="text-slate-800 dark:text-slate-200">{lastRefreshed || "--"}</strong></span>
            </div>
          </div>

          {/* Metric Cards Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-2.5 sm:gap-3.5 mt-5">
            <MetricCard title="Temperature" value={latestMetrics["temperature"]?.value} unit={latestMetrics["temperature"]?.unit === "?" ? "°C" : (latestMetrics["temperature"]?.unit || "°C")} icon="thermometer" color="bg-amber-500" timestamp={latestMetrics["temperature"]?.created_at} isStale={checkStale(latestMetrics["temperature"]?.created_at)} />
            <MetricCard title="Rainfall" value={latestMetrics["rainfall"]?.value} unit={latestMetrics["rainfall"]?.unit || "mm"} icon="cloud-rain" color="bg-blue-500" timestamp={latestMetrics["rainfall"]?.created_at} isStale={checkStale(latestMetrics["rainfall"]?.created_at)} />
            <MetricCard title="Humidity" value={latestMetrics["humidity"]?.value} unit={latestMetrics["humidity"]?.unit || "%"} icon="droplets" color="bg-cyan-500" timestamp={latestMetrics["humidity"]?.created_at} isStale={checkStale(latestMetrics["humidity"]?.created_at)} />
            <MetricCard title="Air Pressure" value={latestMetrics["air_pressure"]?.value} unit={latestMetrics["air_pressure"]?.unit || "Kpa"} icon="gauge" color="bg-purple-500" timestamp={latestMetrics["air_pressure"]?.created_at} isStale={checkStale(latestMetrics["air_pressure"]?.created_at)} />
            <MetricCard title="Wind Speed" value={latestMetrics["wind_velocity"]?.value} unit={latestMetrics["wind_velocity"]?.unit || "m/s"} icon="wind" color="bg-teal-500" timestamp={latestMetrics["wind_velocity"]?.created_at} isStale={checkStale(latestMetrics["wind_velocity"]?.created_at)} />
            
            {latestMetrics["wind_direction"] && (
              <MetricCard title="Wind Direction" value={latestMetrics["wind_direction"]?.value} unit="°" icon="compass" color="bg-sky-500" timestamp={latestMetrics["wind_direction"]?.created_at} isStale={checkStale(latestMetrics["wind_direction"]?.created_at)} />
            )}

            <MetricCard title="Solar Radiation" value={latestMetrics["solar_radiation"]?.value} unit={latestMetrics["solar_radiation"]?.unit || "w/m²"} icon="sun" color="bg-yellow-500" timestamp={latestMetrics["solar_radiation"]?.created_at} isStale={checkStale(latestMetrics["solar_radiation"]?.created_at)} />
            <MetricCard title="Sunshine Hours" value={latestMetrics["sunshine_hours"]?.value} unit={latestMetrics["sunshine_hours"]?.unit || "h"} icon="sun-medium" color="bg-orange-400" timestamp={latestMetrics["sunshine_hours"]?.created_at} isStale={checkStale(latestMetrics["sunshine_hours"]?.created_at)} />
            <MetricCard title="Soil Moisture" value={latestMetrics["soil_humidity"]?.value} unit={latestMetrics["soil_humidity"]?.unit || "%"} icon="sprout" color="bg-emerald-600" timestamp={latestMetrics["soil_humidity"]?.created_at} isStale={checkStale(latestMetrics["soil_humidity"]?.created_at)} />
            <MetricCard title="Soil Temp" value={latestMetrics["soil_temperature"]?.value} unit={latestMetrics["soil_temperature"]?.unit === "?" ? "°C" : (latestMetrics["soil_temperature"]?.unit || "°C")} icon="thermometer" color="bg-lime-600" timestamp={latestMetrics["soil_temperature"]?.created_at} isStale={checkStale(latestMetrics["soil_temperature"]?.created_at)} />
            <MetricCard title="CO2 Level" value={latestMetrics["co2"]?.value} unit={latestMetrics["co2"]?.unit || "PPM"} icon="cloud" color="bg-indigo-500" timestamp={latestMetrics["co2"]?.created_at} isStale={checkStale(latestMetrics["co2"]?.created_at)} />
            <MetricCard title="Illumination" value={latestMetrics["illumination"]?.value} unit={latestMetrics["illumination"]?.unit || "LUX"} icon="lightbulb" color="bg-amber-400" timestamp={latestMetrics["illumination"]?.created_at} isStale={checkStale(latestMetrics["illumination"]?.created_at)} />
            <MetricCard title="PM 2.5" value={latestMetrics["pm25"]?.value} unit={latestMetrics["pm25"]?.unit || "ug/m³"} icon="wind" color="bg-rose-400" timestamp={latestMetrics["pm25"]?.created_at} isStale={checkStale(latestMetrics["pm25"]?.created_at)} />
            <MetricCard title="PM 10" value={latestMetrics["pm10"]?.value} unit={latestMetrics["pm10"]?.unit || "ug/m³"} icon="activity" color="bg-rose-500" timestamp={latestMetrics["pm10"]?.created_at} isStale={checkStale(latestMetrics["pm10"]?.created_at)} />
            <MetricCard title="Battery" value={latestMetrics["battery_level"]?.value} unit={latestMetrics["battery_level"]?.unit || "mV"} icon="battery-charging" color="bg-green-500" timestamp={latestMetrics["battery_level"]?.created_at} isStale={checkStale(latestMetrics["battery_level"]?.created_at)} />
            <MetricCard title="Solar Panel" value={latestMetrics["solar_panel_voltage"]?.value} unit={latestMetrics["solar_panel_voltage"]?.unit || "mV"} icon="zap" color="bg-amber-600" timestamp={latestMetrics["solar_panel_voltage"]?.created_at} isStale={checkStale(latestMetrics["solar_panel_voltage"]?.created_at)} />
          </div>

          {/* Telemetry Table */}
          <div className="mt-7 bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 gap-2">
              <div>
                <h2 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <i data-lucide="layers" className="w-4 h-4 text-emerald-500"></i>
                  Live Telemetry Feeds
                </h2>
                <p className="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-0.5">
                  Showing latest {displayedRows.length} of {filteredRows.length} records in view
                </p>
              </div>
              {selectedDate && (
                <button onClick={() => setSelectedDate("")} className="text-xs text-emerald-600 dark:text-emerald-400 hover:underline text-left">
                  Clear date filter
                </button>
              )}
            </div>

            <div className="overflow-x-auto max-h-[450px]">
              <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 relative whitespace-nowrap">
                <thead className="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 uppercase tracking-wider text-[10px] sticky top-0 z-10 shadow-sm">
                  <tr>
                    <th className="py-2.5 px-3.5">Parameter</th>
                    <th className="py-2.5 px-3.5">Class Code</th>
                    <th className="py-2.5 px-3.5">Value</th>
                    <th className="py-2.5 px-3.5">Unit</th>
                    <th className="py-2.5 px-3.5">Observed Timestamp</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                  {displayedRows.length > 0 ? (
                    displayedRows.map((item, idx) => (
                      <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <td className="py-2 px-3.5 font-semibold text-slate-800 dark:text-slate-100 capitalize">{item.name || item.data_class}</td>
                        <td className="py-2 px-3.5 font-mono text-slate-400">{item.class_num || "--"}</td>
                        <td className="py-2 px-3.5 font-bold text-emerald-600 dark:text-emerald-400">{item.value}</td>
                        <td className="py-2 px-3.5">{item.unit === "?" ? "°C" : (item.unit || "--")}</td>
                        <td className="py-2 px-3.5 text-slate-400">{item.created_at}</td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="5" className="py-8 text-center text-slate-400 dark:text-slate-500">
                        {loading ? "Streaming telemetry records..." : "No readings found for selected filter."}
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
